experiment_id: EXP-007
hypothesis: >
  Temperature sampling (alpha=0.5, p_i = n_i^alpha / sum_j n_j^alpha over
  each language's measured available token count) will land between the
  natural-proportion mixture (alpha=1.0) and uniform oversampling
  (alpha=0.0), giving a macro-average Indic perplexity better than
  EXP-005 (English-heavy) without the extreme oversampling of EXP-010.
next_experiment: "Sweep alpha in {0.0, 0.3, 0.5, 0.7, 1.0} and plot macro-average perplexity vs alpha."
seed: 0
data:
  shards_dir: data/processed
  tokenizer_path: data/tokenizer_v1/indiclm_tokenizer.model
  seq_len: 64
  total_tokens: 20000
  alpha: 0.5
  val_fraction: 0.1
  dataset_version: v1
  tokenizer_version: bpe_v1
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  dropout: 0.0
training:
  max_steps: 60
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  warmup_steps: 10
  eval_every: 15
  checkpoint_every: 60
  log_every: 15
  device: cpu
