experiment_id: EXP-005
hypothesis: >
  An English-heavy static mixture (60% English, remaining 40% split evenly
  across the nine Indic languages) will show lower validation loss on
  English and worse (or no better) loss on Indic languages compared to a
  temperature-sampled or Indic-balanced mixture at the same total token
  budget — demonstrating "how much performance is lost by heavily
  English-dominated training" (Q9).
next_experiment: "Compare against EXP-006 (Indic-balanced) and EXP-007 (temperature sampling) at the same token budget."
seed: 0
data:
  shards_dir: data/processed
  tokenizer_path: data/tokenizer_v1/indiclm_tokenizer.model
  seq_len: 64
  total_tokens: 20000
  val_fraction: 0.1
  dataset_version: v1
  tokenizer_version: bpe_v1
  manual_weights:
    eng: 0.60
    hin: 0.044
    mar: 0.044
    ben: 0.044
    tam: 0.044
    tel: 0.044
    kan: 0.044
    mal: 0.044
    guj: 0.044
    pan: 0.044
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  dropout: 0.0
training:
  max_steps: 60
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  warmup_steps: 10
  eval_every: 15
  checkpoint_every: 60
  log_every: 15
  device: cpu
