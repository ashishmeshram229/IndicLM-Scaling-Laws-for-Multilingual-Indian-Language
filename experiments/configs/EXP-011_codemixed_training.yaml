experiment_id: EXP-011
hypothesis: >
  A tiny model trained only on the code-mixed sample corpus (Hindi-English,
  Marathi-English, Tamil-English) will reach a reasonable training loss
  despite the code-mixed distribution being different from any single
  monolingual corpus, demonstrating the pipeline's ability to identify,
  isolate, and train on code-mixed data end-to-end (data/raw/codemixed_sample
  -> data/processed_codemixed).
next_experiment: "Evaluate a model trained on monolingual + code-mixed data jointly against one trained on monolingual data alone, on a held-out code-mixed set."
seed: 0
data:
  shards_dir: data/processed_codemixed
  tokenizer_path: data/tokenizer_v1/indiclm_tokenizer.model
  seq_len: 48
  total_tokens: 4000
  alpha: 1.0
  val_fraction: 0.15
  dataset_version: codemixed_v1
  tokenizer_version: bpe_v1
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  dropout: 0.0
training:
  max_steps: 40
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  warmup_steps: 8
  eval_every: 10
  checkpoint_every: 40
  log_every: 10
  device: cpu
