experiment_id: EXP-010
hypothesis: >
  Uniform sampling (alpha=0.0) across all ten languages regardless of
  available token count will oversample the lowest-resource language in
  this corpus (Marathi, ~1000 available tokens vs. English's ~3500) by a
  larger factor than any other language, testing whether that oversampling
  helps Marathi perplexity or causes negative transfer (more repetition of
  a small pool without new information) relative to natural-proportion
  sampling (Q6).
next_experiment: "Compare Marathi-specific perplexity against EXP-007 (alpha=0.5) and a natural-proportion (alpha=1.0) run."
seed: 0
data:
  shards_dir: data/processed
  tokenizer_path: data/tokenizer_v1/indiclm_tokenizer.model
  seq_len: 64
  total_tokens: 20000
  alpha: 0.0
  val_fraction: 0.1
  dataset_version: v1
  tokenizer_version: bpe_v1
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  dropout: 0.0
training:
  max_steps: 60
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  warmup_steps: 10
  eval_every: 15
  checkpoint_every: 60
  log_every: 15
  device: cpu
