[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indiclm"
version = "0.0.1"
description = "IndicLM: a research platform for scaling laws, data-mixture optimization, and training infrastructure for multilingual Indian-language models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ashish Meshram" }]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyarrow>=15.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.19",
    "datasketch>=1.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]
tracking = ["mlflow>=2.12"]

[project.scripts]
indiclm = "indiclm.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
