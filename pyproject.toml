[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indiclm"
version = "0.0.1"
description = "IndicLM: a research platform for scaling laws, data-mixture optimization, and training infrastructure for multilingual Indian-language models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ashish Meshram" }]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyarrow>=15.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.19",
    "datasketch>=1.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "scipy-stubs>=1.12; python_version >= '3.10'",
]
tracking = ["mlflow>=2.12"]

[project.scripts]
indiclm = "indiclm.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (function call in a default argument) is a real anti-pattern in
# general Python, but it's the canonical Typer/FastAPI idiom -- every CLI
# command and API endpoint in this repo uses `= typer.Option(...)` /
# `= Field(...)` as a default, which Typer/FastAPI evaluate once at
# registration time, not per-call. Ignoring it here (rather than
# rewriting ~30 call sites against the framework's own documented style)
# is the correct fix, not a suppression of a real bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

# torch/numpy's type stubs are deliberately loose around Tensor/ndarray
# return types (e.g. nn.Module.__call__, np.polyfit), so warn_return_any
# fires on correct code in tensor-heavy modules. Kept strict everywhere
# else (CLI, data pipeline, experiment bookkeeping) where it catches real
# bugs, per docs/reproducibility.md's "no fabricated guarantees" stance:
# we relax the rule explicitly and narrowly rather than globally.
[[tool.mypy.overrides]]
module = [
    "indiclm.models.*",
    "indiclm.training.trainer",
    "indiclm.training.checkpoint",
    "indiclm.experiments.scaling",
    "indiclm.experiments.manifest",
    "indiclm.utils.logging",
]
warn_return_any = false

# Third-party libraries with no published type stubs. `mlflow` is an
# optional extra (see `tracking` in [project.optional-dependencies]) that
# isn't installed by default, so it's expected to be unresolvable here.
[[tool.mypy.overrides]]
module = ["datasketch.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
