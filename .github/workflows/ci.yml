name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy)
        run: mypy src
      - name: Unit + integration tests (CPU, synthetic data only)
        run: pytest -q

  build-on-main:
    if: github.ref == 'refs/heads/main'
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package installs cleanly
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import indiclm; print(indiclm.__version__)"
